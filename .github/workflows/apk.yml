name: APKs bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [zeiterfassung, wildverkauf, jahrringzaehler]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null
          pip install --quiet pillow

      - name: Vorbereiten (Manifest, Icon, Farben)
        run: |
          set -o pipefail
          python3 tools/prepare.py ${{ matrix.app }} 2>&1 | tee build.log

      - name: Bauen
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk ${{ matrix.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}.apk

      # Bei Fehler das Log in den Branch ci-log-<app> schreiben (lesbar ohne Login)
      - name: Log sichern
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "kein Log" > /tmp/build.log
          git checkout --orphan ci-log-${{ matrix.app }}
          git rm -rf . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build-Log ${{ github.run_number }} (${{ matrix.app }})"
          git push -f origin ci-log-${{ matrix.app }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la apks
          [ -n "$(ls apks/*.apk 2>/dev/null)" ] || { echo "keine APKs"; exit 1; }
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apks/*.apk \
            --title "Apps (Build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} aus ${{ github.sha }}. Fehlt eine APK, ist ihr Build fehlgeschlagen (Branch ci-log-<app>)." \
            --target ${{ github.sha }}
